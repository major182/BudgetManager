{# フォームの1項目（画面設計書 1.5）。誤りは入力欄のすぐ下に赤字で出す #}
{% if field.is_hidden %}{{ field }}{% else %}
<div class="field"{% if depends_on %} data-depends-on="{{ depends_on }}"{% endif %}>
  {% if field.widget_type == "checkbox" %}
    <span class="label"></span>
    <label class="check">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="req">必須</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="field-help">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}
</div>
{% endif %}
