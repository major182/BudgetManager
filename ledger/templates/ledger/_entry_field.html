{# 明細入力の1項目。誤りは「登録」を押したときだけ出す（入力の途中の描き直しでは出さない） #}
<div class="field">
  <label for="{{ field.id_for_label }}">{% firstof label field.label %}{% if field.field.required %}<span class="req">必須</span>{% endif %}</label>
  {% if calc %}
  <div class="with-btn">
    {{ field }}
    {# 電卓（F-TX-06） #}
    <button type="button" class="icon-btn" data-calc="{{ field.id_for_label }}" aria-label="電卓">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>
    </button>
  </div>
  {% else %}
  {{ field }}
  {% endif %}
  {% if show_errors %}{% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}{% endif %}
</div>
